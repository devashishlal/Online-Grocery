name: Controlled Qodo Review POC

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  qodo-review:
    if: github.event.label.name == 'qodo-review'
    runs-on: ubuntu-latest

    steps:
      - name: Comment /review
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            /review

      - name: Remove qodo-review label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: qodo-review

  qodo-improve:
    if: github.event.label.name == 'qodo-improve'
    runs-on: ubuntu-latest

    steps:
      - name: Comment /improve
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            /improve

      - name: Remove qodo-improve label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: qodo-improve

  qodo-describe:
    if: github.event.label.name == 'qodo-describe'
    runs-on: ubuntu-latest

    steps:
      - name: Comment /describe
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            /describe

      - name: Remove qodo-describe label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: qodo-describe